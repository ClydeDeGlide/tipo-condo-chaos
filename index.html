function bar(px,py,w,h,val,col,label,align='left'){x.fillStyle='#07101ccc';x.fillRect(px,py,w,h);x.fillStyle=col;x.fillRect(px+4,py+4,(w-8)*clamp(val,0,1),h-8);x.strokeStyle='#ffffff38';x.strokeRect(px,py,w,h);x.fillStyle='#fff';x.font='700 18px system-ui';x.textAlign=align;x.fillText(label,align==='left'?px:px+w,py-9)}
function draw(){x.clearRect(0,0,W,H);x.save();if(shake)x.translate(rnd(-shake,shake),rnd(-shake,shake));drawBackground();x.fillStyle=`rgba(245,225,198,${level%2?.04:.10})`;x.fillRect(0,0,W,H);x.fillStyle='#3b231522';x.fillRect(0,G+4,W,H-G);for(const e of enemies){if(Math.abs(e.x-camera-W/2)<W){fighter(e);bar(e.x-camera-e.w/2,e.y-e.h-34,e.w,9,e.hp/e.max,e.type==='master'?'#ff7fc8':'#e0525f','')}}fighter(player,true);for(const q of particles){x.globalAlpha=q.life/38;x.fillStyle=q.col;x.beginPath();x.arc(q.x-camera,q.y,q.r,0,7);x.fill()}x.globalAlpha=1;x.restore();
